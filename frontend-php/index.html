
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product CRUD</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-box-seam me-2"></i>Product Manager
            </a>
            <span class="text-white">CRUD Application</span>
        </div>
    </nav>

    <div class="container py-5">

        <div class="row g-4">

            <!-- Product Form -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-primary text-white py-3">
                        <h5 class="mb-0">
                            <i class="bi bi-plus-circle me-2"></i>
                            Add Product
                        </h5>
                    </div>

                    <div class="card-body p-4">
                        <form id="productForm">

                            <input type="hidden" id="editId">

                            <div class="mb-3">
                                <label for="pname" class="form-label">
                                    Product Name
                                </label>
                                <input type="text" id="pname"
                                       class="form-control"
                                       placeholder="Enter product name"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="price" class="form-label">
                                    Price (₹)
                                </label>
                                <input type="number" id="price"
                                       class="form-control"
                                       placeholder="Enter price"
                                       min="0.01" step="0.01"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">
                                    Description
                                </label>
                                <textarea id="description"
                                          class="form-control"
                                          rows="3"
                                          placeholder="Enter product description"
                                          required></textarea>
                            </div>

                            <div class="mb-4">
                                <label for="image" class="form-label">
                                    Product Image
                                </label>
                                <input type="file" id="image"
                                       class="form-control"
                                       accept="image/*">
                                <img id="preview"
                                     class="img-thumbnail mt-3 d-none"
                                     style="width:100px;height:100px;object-fit:cover;"
                                     alt="Product preview">
                            </div>

                            <button type="submit" id="submitBtn"
                                    class="btn btn-primary w-100">
                                <i class="bi bi-save me-2"></i>
                                Save Product
                            </button>

                            <button type="button" id="cancelBtn"
                                    class="btn btn-outline-secondary w-100 mt-2 d-none">
                                Cancel Edit
                            </button>

                        </form>
                    </div>
                </div>
            </div>

            <!-- Product List -->
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Product List</h5>
                            <span class="badge bg-primary" id="count">0 Products</span>
                        </div>
                    </div>

                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th>#</th>
                                        <th>Image</th>
                                        <th>Product</th>
                                        <th>Price</th>
                                        <th>Description</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="productList">
                                    <tr>
                                        <td colspan="6" class="text-center py-4 text-muted">
                                            No products added yet.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

 <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js">


 </script>
 <script src="script.js">  
 </script>
</body>
</html>
